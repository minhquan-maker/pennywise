# Local PostgreSQL for development: `docker compose up -d db`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pennywise
    ports:
      - "5432:5432"
    volumes:
      - pennywise-pg:/var/lib/postgresql/data
volumes:
  pennywise-pg:
